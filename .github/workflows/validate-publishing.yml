name: Validate Publishing

on:
  workflow_dispatch:
    inputs:
      module:
        description: SDK whose release credentials and artifacts to validate
        type: choice
        options: [java-restclient, java-resttemplate, kotlin-okhttp, dotnet, typescript-fetch]

permissions:
  contents: read

jobs:
  jvm:
    if: contains(fromJSON('["java-restclient", "java-resttemplate", "kotlin-okhttp"]'), inputs.module)
    name: Validate ${{ inputs.module }} publication
    runs-on: ubuntu-latest
    environment: Release
    steps:
      - uses: actions/checkout@v6

      - uses: troii-actions/setup-jvm@v1
        with:
          java-version-file: .sdkmanrc

      - name: Sign the Maven publication
        env:
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.MAVEN_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.MAVEN_SIGNING_PASSWORD }}
        run: ./gradlew ":${{ inputs.module }}:signMavenJavaPublication" --scan

      - name: Verify the release bundle
        env:
          MODULE: ${{ inputs.module }}
        run: |
          publication="sdk/${MODULE}/build/publications/mavenJava"
          library="sdk/${MODULE}/build/libs"
          test -s "${publication}/pom-default.xml"
          test -s "${publication}/pom-default.xml.asc"
          test -s "${publication}/module.json"
          test -s "${publication}/module.json.asc"
          test "$(find "$library" -maxdepth 1 -name '*.jar' -size +0c | wc -l)" -eq 3
          test "$(find "$library" -maxdepth 1 -name '*.jar.asc' -size +0c | wc -l)" -eq 3

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.module }}-signed-publication
          path: |
            sdk/${{ inputs.module }}/build/libs/*
            sdk/${{ inputs.module }}/build/publications/mavenJava/*
          retention-days: 7

  typescript:
    name: Validate TypeScript publication
    if: inputs.module == 'typescript-fetch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: troii-actions/setup-jvm@v1
        with:
          java-version-file: .sdkmanrc
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install dependencies and test the TypeScript SDK
        working-directory: sdk/typescript-fetch
        run: |
          npm ci
          npm test
      - name: Pack the npm publication
        run: ./gradlew :typescript-fetch:npmPack --scan
      - uses: actions/upload-artifact@v6
        with:
          name: typescript-publication
          path: sdk/typescript-fetch/build/npm/*.tgz
          retention-days: 7

  dotnet:
    name: Validate .NET publication
    if: inputs.module == 'dotnet'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: troii-actions/setup-jvm@v1
        with:
          java-version-file: .sdkmanrc
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.x
            10.x
      - name: Test and pack the NuGet publication
        run: ./gradlew :dotnet:dotnetTest :dotnet:dotnetPack --scan
      - uses: actions/upload-artifact@v6
        with:
          name: dotnet-publication
          path: sdk/dotnet/build/nuget/*.nupkg
          retention-days: 7
