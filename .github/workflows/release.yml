name: Release

# A bare version tag releases the contract. A module/version tag publishes one SDK.
on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'
      - 'java-restclient/[0-9]*.[0-9]*.[0-9]*'
      - 'java-resttemplate/[0-9]*.[0-9]*.[0-9]*'
      - 'kotlin-okhttp/[0-9]*.[0-9]*.[0-9]*'
      - 'dotnet/[0-9]*.[0-9]*.[0-9]*'
      - 'typescript-fetch/[0-9]*.[0-9]*.[0-9]*'
      - 'swift/[0-9]*.[0-9]*.[0-9]*'
      - 'python/[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-verify:
    name: Build & Verify
    permissions:
      contents: read
      checks: write
    uses: ./.github/workflows/sdk.yml

  resolve:
    name: Resolve tag
    runs-on: ubuntu-latest
    outputs:
      kind: ${{ steps.tag.outputs.kind }}
      module: ${{ steps.tag.outputs.module }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # A release must point to history that has landed on main.
      - name: Verify the tag is on main
        run: |
          git fetch -q origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::${GITHUB_REF_NAME} points at ${GITHUB_SHA}, which is not on main."
            exit 1
          fi

      - name: Read the tag
        id: tag
        run: |
          case "$GITHUB_REF_NAME" in
            */*)
              module=${GITHUB_REF_NAME%/*}
              version=${GITHUB_REF_NAME##*/}
              case "$module" in
                java-restclient | java-resttemplate | kotlin-okhttp | dotnet | typescript-fetch | swift | python) ;;
                *)
                  echo "::error::Publishing is not configured for module '${module}'."
                  exit 1
                  ;;
              esac
              declared=$(sed -n "s/^${module}=//p" sdk/versions.properties)
              if [ "$declared" != "$version" ]; then
                echo "::error::Tag says ${module} ${version}, sdk/versions.properties says ${declared}. Bump first, tag second."
                exit 1
              fi
              echo "kind=module" >> "$GITHUB_OUTPUT"
              echo "module=$module" >> "$GITHUB_OUTPUT"
              echo "version=$version" >> "$GITHUB_OUTPUT"
              ;;
            *)
              declared=$(sed -n 's/^  version: //p' spec/openapi.yaml | head -1)
              if [ "$declared" != "$GITHUB_REF_NAME" ]; then
                echo "::error::Tag says ${GITHUB_REF_NAME}, spec/openapi.yaml says ${declared}."
                exit 1
              fi
              echo "kind=contract" >> "$GITHUB_OUTPUT"
              echo "version=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
              ;;
          esac

  contract:
    name: Release the contract
    needs: [build-verify, resolve]
    if: needs.resolve.outputs.kind == 'contract'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          gh release create "$VERSION" \
            --title "timr API $VERSION" \
            --notes "Release notes: https://developer.timr.com — the specification at this version is spec/openapi.yaml."

  sdk:
    name: Publish ${{ needs.resolve.outputs.module }} ${{ needs.resolve.outputs.version }}
    needs: [build-verify, resolve]
    if: needs.resolve.outputs.kind == 'module' && contains(fromJSON('["java-restclient", "java-resttemplate", "kotlin-okhttp"]'), needs.resolve.outputs.module)
    runs-on: ubuntu-latest
    environment: Release
    env:
      MODULE: ${{ needs.resolve.outputs.module }}
      VERSION: ${{ needs.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v6
        with:
          java-version-file: .sdkmanrc

      - uses: gradle/actions/setup-gradle@v6
        with:
          add-job-summary: on-failure

      - name: Publish to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.MAVEN_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.MAVEN_SIGNING_PASSWORD }}
        run: ./gradlew ":${MODULE}:publishAndReleaseToMavenCentral" --scan

      - name: Summary
        run: |
          read -r group artifact version < <(yq -p=xml -o=tsv '.project | [.groupId, .artifactId, .version]' "sdk/${MODULE}/build/publications/mavenJava/pom-default.xml")
          printf '\nPublished [%s:%s:%s](https://central.sonatype.com/artifact/%s/%s/%s).\n' "$group" "$artifact" "$version" "$group" "$artifact" "$version" >> "$GITHUB_STEP_SUMMARY"

  dotnet:
    name: Publish .NET ${{ needs.resolve.outputs.version }}
    needs: [build-verify, resolve]
    if: needs.resolve.outputs.kind == 'module' && needs.resolve.outputs.module == 'dotnet'
    runs-on: ubuntu-latest
    environment: Release
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          java-version-file: .sdkmanrc

      - uses: gradle/actions/setup-gradle@v6
        with:
          add-job-summary: on-failure
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.x
            10.x
      - name: Pack the NuGet publication
        run: ./gradlew :dotnet:dotnetPack --scan
      - name: Get a short-lived NuGet publishing key
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Publish to NuGet
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: ./gradlew :dotnet:publish --scan
      - name: Summary
        run: |
          read -r name version < <(unzip -p sdk/dotnet/build/nuget/*.nupkg '*.nuspec' | yq -p=xml -o=tsv '.package.metadata | [.id, .version]')
          printf '\nPublished [%s %s](https://www.nuget.org/packages/%s/%s).\n' "$name" "$version" "$name" "$version" >> "$GITHUB_STEP_SUMMARY"

  typescript:
    name: Publish TypeScript ${{ needs.resolve.outputs.version }}
    needs: [build-verify, resolve]
    if: needs.resolve.outputs.kind == 'module' && needs.resolve.outputs.module == 'typescript-fetch'
    runs-on: ubuntu-latest
    environment: Release
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          java-version-file: .sdkmanrc

      - uses: gradle/actions/setup-gradle@v6
        with:
          add-job-summary: on-failure
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Install dependencies
        working-directory: sdk/typescript-fetch
        run: npm ci
      - name: Publish to npm
        run: ./gradlew :typescript-fetch:publish --scan
      - name: Summary
        run: |
          jq -r '"\nPublished [\(.name) \(.version)](https://www.npmjs.com/package/\(.name)/v/\(.version))."' sdk/typescript-fetch/package.json >> "$GITHUB_STEP_SUMMARY"

  swift:
    name: Publish Swift ${{ needs.resolve.outputs.version }}
    needs: [build-verify, resolve]
    if: needs.resolve.outputs.kind == 'module' && needs.resolve.outputs.module == 'swift'
    runs-on: macos-latest
    environment: Release
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Export and test the Swift package
        id: export
        run: |
          set -euo pipefail
          git config user.name "GitHub Actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          export=$(git subtree split --prefix sdk/swift "$GITHUB_SHA")
          echo "commit=$export" >> "$GITHUB_OUTPUT"
          package="$RUNNER_TEMP/swift-publication"
          mkdir -p "$package"
          git archive "$export" | tar -x -C "$package"
          grep -F "s.version = '$VERSION'" "$package/TimrApi.podspec"
          ruby -c "$package/TimrApi.podspec"
          swift test --package-path "$package"
      - name: Publish the Swift version tag
        env:
          GH_TOKEN: ${{ secrets.SWIFT_REPO_TOKEN }}
          EXPORT_COMMIT: ${{ steps.export.outputs.commit }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" || { echo "::error::Configure SWIFT_REPO_TOKEN in the Release environment."; exit 1; }
          gh auth setup-git
          remote=https://github.com/troii/timr-api-swift.git
          existing=$(git ls-remote "$remote" "refs/tags/${VERSION}")
          if [ -n "$existing" ]; then
            test "${existing%%[[:space:]]*}" = "$EXPORT_COMMIT" || { echo "::error::The Swift version tag already points at different content."; exit 1; }
          else
            git push "$remote" "${EXPORT_COMMIT}:refs/tags/${VERSION}"
          fi
          published=$(git ls-remote "$remote" "refs/tags/${VERSION}")
          test "${published%%[[:space:]]*}" = "$EXPORT_COMMIT"
      - name: Summary
        run: echo "Published [TimrApi ${VERSION}](https://github.com/troii/timr-api-swift/tree/${VERSION}) from \`${GITHUB_REF_NAME}\`." >> "$GITHUB_STEP_SUMMARY"

  python:
    name: Publish Python ${{ needs.resolve.outputs.version }}
    needs: [build-verify, resolve]
    if: needs.resolve.outputs.kind == 'module' && needs.resolve.outputs.module == 'python'
    runs-on: ubuntu-latest
    environment: Release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          java-version-file: .sdkmanrc

      - uses: gradle/actions/setup-gradle@v6
        with:
          add-job-summary: on-failure
      - uses: actions/setup-python@v6
        with:
          python-version: '3.9'
      - name: Build and check the Python distributions
        run: |
          python -m pip install build twine
          ./gradlew :python:pythonPack --scan
          python -m twine check --strict sdk/python/build/dist/*
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdk/python/build/dist
      - name: Summary
        run: |
          read -r name version < <(awk '/^Name: / {name = $2} /^Version: / {version = $2} /^[[:space:]]*$/ {print name, version; exit}' sdk/python/*.egg-info/PKG-INFO)
          project=$(printf '%s' "$name" | tr '[:upper:]' '[:lower:]' | sed -E 's/[-_.]+/-/g')
          printf '\nPublished [%s %s](https://pypi.org/project/%s/%s/).\n' "$name" "$version" "$project" "$version" >> "$GITHUB_STEP_SUMMARY"
