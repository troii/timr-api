name: Publish Snapshot

on:
  workflow_dispatch:
    inputs:
      module:
        description: Which SDK to publish a snapshot of
        type: choice
        options: [java-restclient, java-resttemplate, kotlin-okhttp, dotnet, typescript-fetch, python]

permissions:
  contents: read

concurrency:
  group: publish-snapshot-${{ github.ref }}-${{ inputs.module }}
  cancel-in-progress: false

jobs:
  publish:
    if: contains(fromJSON('["java-restclient", "java-resttemplate", "kotlin-okhttp"]'), inputs.module)
    name: Publish ${{ inputs.module }} snapshot
    runs-on: ubuntu-latest
    env:
      SNAPSHOT: 'true'
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v6
        with:
          java-version-file: .sdkmanrc

      - uses: gradle/actions/setup-gradle@v6
        with:
          add-job-summary: on-failure

      - name: Publish snapshot to Maven Central
        env:
          MODULE: ${{ inputs.module }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: ./gradlew ":${MODULE}:publishToMavenCentral" --scan
      - name: Summary
        env:
          MODULE: ${{ inputs.module }}
        run: |
          read -r group artifact version < <(yq -p=xml -o=tsv '.project | [.groupId, .artifactId, .version]' "sdk/${MODULE}/build/publications/mavenJava/pom-default.xml")
          path="${group//.//}/${artifact}/${version}/maven-metadata.xml"
          printf '\nPublished [%s:%s:%s](https://central.sonatype.com/repository/maven-snapshots/%s).\n' "$group" "$artifact" "$version" "$path" >> "$GITHUB_STEP_SUMMARY"

  dotnet:
    name: Publish .NET snapshot
    if: inputs.module == 'dotnet'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      SNAPSHOT: 'true'
      NUGET_SNAPSHOT_STAMP: ${{ github.run_id }}.${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          java-version-file: .sdkmanrc

      - uses: gradle/actions/setup-gradle@v6
        with:
          add-job-summary: on-failure
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.x
            10.x
      - name: Test and pack the NuGet snapshot
        run: ./gradlew :dotnet:dotnetTest :dotnet:dotnetPack --scan
      - name: Get a short-lived NuGet publishing key
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Publish snapshot to NuGet
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: ./gradlew :dotnet:publish --scan
      - name: Summary
        run: |
          read -r name version < <(unzip -p sdk/dotnet/build/nuget/*.nupkg '*.nuspec' | yq -p=xml -o=tsv '.package.metadata | [.id, .version]')
          printf '\nPublished [%s %s](https://www.nuget.org/packages/%s/%s).\n' "$name" "$version" "$name" "$version" >> "$GITHUB_STEP_SUMMARY"

  typescript:
    name: Publish TypeScript snapshot
    if: inputs.module == 'typescript-fetch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      SNAPSHOT: 'true'
      NPM_SNAPSHOT_STAMP: ${{ github.run_id }}.${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          java-version-file: .sdkmanrc

      - uses: gradle/actions/setup-gradle@v6
        with:
          add-job-summary: on-failure
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Install dependencies and test the TypeScript SDK
        working-directory: sdk/typescript-fetch
        run: |
          npm ci
          npm test
      - name: Publish snapshot to npm
        run: ./gradlew :typescript-fetch:publish --scan
      - name: Summary
        run: |
          jq -r '"\nPublished [\(.name) \(.version)](https://www.npmjs.com/package/\(.name)/v/\(.version))."' sdk/typescript-fetch/package.json >> "$GITHUB_STEP_SUMMARY"

  python:
    name: Publish Python snapshot
    if: inputs.module == 'python'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      SNAPSHOT: 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          java-version-file: .sdkmanrc

      - uses: gradle/actions/setup-gradle@v6
        with:
          add-job-summary: on-failure
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Build and test the Python snapshot
        run: |
          python -m pip install --upgrade pip # --group requires pip 25.1+, newer than the pip bundled with Python 3.11.
          python -m pip install --group sdk/python/pyproject.toml:build -r sdk/python/test-requirements.txt
          export PYTHON_SNAPSHOT_STAMP="$((GITHUB_RUN_ID * 10000 + GITHUB_RUN_ATTEMPT))"
          ./gradlew :python:pythonPack --scan
          python -m twine check --strict sdk/python/build/dist/*
          python -m pip install sdk/python/build/dist/*.whl
          python -m pytest sdk/python/tests
      - name: Publish snapshot to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdk/python/build/dist
          repository-url: https://test.pypi.org/legacy/
      - name: Summary
        run: |
          read -r name version < <(awk '/^Name: / {name = $2} /^Version: / {version = $2} /^[[:space:]]*$/ {print name, version; exit}' sdk/python/*.egg-info/PKG-INFO)
          project=$(printf '%s' "$name" | tr '[:upper:]' '[:lower:]' | sed -E 's/[-_.]+/-/g')
          printf '\nPublished [%s %s](https://test.pypi.org/project/%s/%s/).\n' "$name" "$version" "$project" "$version" >> "$GITHUB_STEP_SUMMARY"
