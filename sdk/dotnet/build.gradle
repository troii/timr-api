plugins {
    alias(libs.plugins.openapi)
    id 'base'
}

tasks.register('cleanOpenApiGenerate', Delete) {
    // Clear both API directories so the assembly only exposes the configured namespace.
    delete layout.projectDirectory.dir("Timr.Api/Api")
    delete layout.projectDirectory.dir("Timr.Api/Endpoints")
    delete layout.projectDirectory.dir("Timr.Api/Model")
}

openApiGenerate {
    generatorName = 'csharp'
    apiPackage = 'Endpoints'
    outputDir = "$projectDir"
    templateDir = "$projectDir/templates"
    configOptions = [
            apiName               : 'TimrApiClient',
            packageName           : 'Timr.Api',
            sourceFolder          : './',
            nullableReferenceTypes: 'true',
            useDateTimeOffset     : 'true'
    ]
}

tasks.named('openApiGenerate').configure { task ->
    task.dependsOn('cleanOpenApiGenerate')
}

// Generated sources are committed into this module's source set, so the restore that reads them runs after
// generation; a build on its own would otherwise quietly compile the previous generation's output.
tasks.matching { it.name == 'dotnetRestore' }.configureEach {
    dependsOn tasks.named('openApiGenerate')
}


def snapshot = rootProject.ext.snapshotBuild
def baseVersion = rootProject.ext.sdkVersions[project.name]
def snapshotStamp = System.getenv('NUGET_SNAPSHOT_STAMP') ?: rootProject.ext.snapshotStamp

def packageVersion = snapshot ? "${baseVersion}-snapshot.${snapshotStamp}" : baseVersion
File nugetOutputDirectory = layout.buildDirectory.file("nuget/").get().asFile

tasks.register('dotnetRestore', Exec) {
    group = 'build'
    description = 'Runs dotnet restore for the timr SDK solution.'
    workingDir = project.projectDir

    commandLine 'dotnet', 'restore', '.'
}

tasks.register('dotnetBuild', Exec) {
    group = 'build'
    description = 'Builds the timr SDK solution with the shared version.'
    workingDir = project.projectDir

    dependsOn tasks.named('dotnetRestore')
    commandLine 'dotnet', 'build', '.',
            '-c', 'Release',
            '-p:Version=' + packageVersion
}

tasks.register('dotnetTest', Exec) {
    group = 'verification'
    description = 'Runs the timr SDK test suite.'
    environment 'TIMR_SDK_VERSION', packageVersion
    workingDir = project.projectDir

    dependsOn tasks.named('dotnetRestore')
    commandLine 'dotnet', 'test', '.',
            '-c', 'Release',
            '--no-restore',
            '-p:Version=' + packageVersion
}

tasks.register('dotnetPack', Exec) {
    group = 'publishing'
    description = 'Creates the NuGet package at the module version.'
    workingDir = project.projectDir

    dependsOn tasks.named('dotnetBuild')
    doFirst {
        nugetOutputDirectory.mkdirs()
    }
    commandLine 'dotnet', 'pack', 'Timr.Api/Timr.Api.csproj',
            '-c', 'Release',
            '--no-build',
            '-o', nugetOutputDirectory.absolutePath,
            '-p:Version=' + packageVersion,
            '-p:PackageVersion=' + packageVersion
}

tasks.named('assemble').configure { task ->
    task.dependsOn tasks.named('dotnetBuild')
}

tasks.named('check').configure { task ->
    task.dependsOn tasks.named('dotnetTest')
}

tasks.register('publish', Exec) {
    group = 'publishing'
    description = 'Publishes the NuGet package to nuget.org.'

    dependsOn tasks.named('dotnetPack')
    doFirst {
        if (!System.getenv('NUGET_API_KEY')) {
            throw new GradleException('NUGET_API_KEY environment variable must be set to publish to nuget.org')
        }
    }

    // .NET SDK 10.0.300+ reads NUGET_API_KEY without exposing it in command arguments.
    commandLine 'dotnet', 'nuget', 'push', "${nugetOutputDirectory}/timr.Api.${packageVersion}.nupkg", '--source', 'https://api.nuget.org/v3/index.json'

    doLast {
        println "Published 'timr.Api:${packageVersion}' to https://www.nuget.org/packages/timr.Api/${packageVersion}"
    }
}
