plugins {
    alias(libs.plugins.openapi)
    id "swift-library"
}

// swift5 ties the API class, the Swift module, the SwiftPM package and the podspec filename all to
// projectName. The class should read TimrAPI while the module and pod are TimrApi, so projectName
// supplies the class and moduleName — read by our Package.swift and Podspec templates — supplies the
// packaging identity.
def apiClassPrefix = 'Timr'
def moduleName = 'TimrApi'

def cleanOpenApiGenerateTask = tasks.register('cleanOpenApiGenerate', Delete) {
    delete fileTree("$projectDir/$moduleName")
}


openApiGenerate {
    generatorName = "swift5"
    additionalProperties = [moduleName: moduleName]
    library = "alamofire"
    outputDir = "$projectDir"
    templateDir = "$projectDir/templates"
    configOptions = [
            projectName        : apiClassPrefix,
            library            : "alamofire",
            responseAs         : "AsyncAwait",
            swiftPackagePath   : moduleName,
            podAuthors         : "troii Software GmbH",
            podSummary         : "Official Swift client for the timr API",
            podDescription     : "Official Swift client for the timr API, generated from its OpenAPI specification.",
            podHomepage        : "https://developer.timr.com",
            podDocumentationURL: "https://developer.timr.com",
            podLicense         : "'Apache-2.0'",
            podSource          : "{ :git => 'https://github.com/troii/timr-api.git', :tag => s.version.to_s }"
    ]
}

tasks.named('openApiGenerate').configure { task ->
    task.dependsOn(cleanOpenApiGenerateTask)
    task.finalizedBy('normalizeSwiftStringLiterals')
}

// OpenAPI Generator escapes forward slashes even though Swift string literals do not support that escape.
tasks.register('normalizeSwiftStringLiterals') {
    doLast {
        fileTree("$projectDir/$moduleName").matching { include '**/*.swift' }.each { sourceFile ->
            def source = sourceFile.getText('UTF-8')
            def normalized = source.replace('\\/', '/')
            if (source != normalized) {
                sourceFile.setText(normalized, 'UTF-8')
            }
        }
    }
}
