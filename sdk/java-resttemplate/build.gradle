plugins {
    alias(libs.plugins.openapi)
    id 'java-library'
    alias(libs.plugins.maven.publish)
    id 'maven-publish'
}
repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
    withJavadocJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
}

dependencies {
    implementation platform(libs.spring.boot.dependencies)

    implementation 'tools.jackson.core:jackson-databind'
    implementation 'com.fasterxml.jackson.core:jackson-annotations'
    // JsonNullable is exposed in generated model getters/setters, so it is part of the public API
    api libs.jackson.nullable

    // api because RestTemplate and HttpMethod appear in this client's public signatures.
    api 'org.springframework:spring-web'
    implementation 'org.apache.httpcomponents.client5:httpclient5' // PATCH support and connection pooling
    implementation 'org.springframework:spring-context'

    // @jakarta.annotation.Generated is emitted on every model
    implementation libs.jakarta.annotation
    // JSpecify annotations appear on generated public signatures, so consumers need them on their compile classpath
    api libs.jspecify
    implementation libs.swagger.annotations

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

def cleanOpenApiGenerateTask = tasks.register('cleanOpenApiGenerate', Delete) {
    delete fileTree("$projectDir/src/main/java/com/timr/api/apis")
    delete fileTree("$projectDir/src/main/java/com/timr/api/models")
}

openApiGenerate {
    generatorName = 'java'
    outputDir = "$projectDir"
    templateDir = "$projectDir/templates"
    configOptions = [
            library                    : 'resttemplate',
            serializationLibrary       : 'jackson',
            useSpringBoot4             : 'true',
            useJackson3                : 'true',
            dateLibrary                : 'java8',
            openApiNullable            : 'true',
            containerDefaultToNull     : 'true',
            legacyDiscriminatorBehavior: 'true',
            generateClientAsBean       : 'true',
            useJakartaEe               : 'true',
            apiPackage                 : 'com.timr.api.apis',
            modelPackage               : 'com.timr.api.models',
            hideGenerationTimestamp    : 'true'
    ]
}

tasks.named('openApiGenerate').configure { task ->
    task.dependsOn(cleanOpenApiGenerateTask)
}

// Generated sources are committed into this module's source set, so everything that reads them runs
// after generation; `build` on its own would otherwise quietly compile the previous generation's output.
tasks.matching {
    it.name in ['compileJava', 'compileTestJava', 'processResources', 'processTestResources', 'sourcesJar', 'javadoc']
}.configureEach {
    dependsOn tasks.named('openApiGenerate')
}

// The client reads its own version from here rather than carrying it in a hand-maintained string.
jar {
    manifest {
        attributes(
                'Implementation-Title': 'timr-api-resttemplate',
                'Implementation-Version': project.version
        )
    }
}

def snapshot = rootProject.ext.snapshotBuild

publishing {
    publications {
        mavenJava(MavenPublication) {
            groupId = project.group
            artifactId = 'timr-api-resttemplate'
            version = project.version
            from components.java

            pom {
                name = 'timr-api-resttemplate'
                description = 'Official Java client for the timr API, built on Spring RestTemplate.'
                url = 'https://developer.timr.com'
                licenses {
                    license {
                        name = 'The Apache License, Version 2.0'
                        url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                    }
                }
                organization {
                    name = 'troii Software GmbH'
                    url = 'https://troii.com'
                }
                developers {
                    developer {
                        id = 'troii'
                        name = 'troii Software GmbH'
                        email = 'info@timr.com'
                        organization = 'troii Software GmbH'
                        organizationUrl = 'https://troii.com'
                    }
                }
                scm {
                    url = 'https://github.com/troii/timr-api'
                    connection = 'scm:git:https://github.com/troii/timr-api.git'
                    developerConnection = 'scm:git:ssh://git@github.com/troii/timr-api.git'
                }
            }
        }
    }
}

mavenPublishing {
    publishToMavenCentral()
    if (!snapshot) {
        signAllPublications()
    }
}
