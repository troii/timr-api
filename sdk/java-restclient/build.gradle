plugins {
    alias(libs.plugins.openapi)
    id 'java-library'
    alias(libs.plugins.google.artifact.registry)
    id 'maven-publish'
}

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
    withJavadocJar()
}

dependencies {
    implementation platform(libs.spring.boot.dependencies)

    implementation 'tools.jackson.core:jackson-databind'
    implementation 'com.fasterxml.jackson.core:jackson-annotations'
    // JsonNullable is exposed in generated model getters/setters, so it is part of the public API
    api libs.jackson.nullable

    // Not the web starter: an SDK needs Spring's web client, not a servlet container. spring-web is
    // api because RestClient.Builder and HttpMethod appear in this client's public signatures.
    api 'org.springframework:spring-web'
    implementation 'org.springframework:spring-context'
    implementation 'org.springframework.boot:spring-boot-autoconfigure'
    implementation 'org.apache.httpcomponents.client5:httpclient5' // PATCH support and connection pooling
    // @jakarta.annotation.Generated is emitted on every model
    implementation libs.jakarta.annotation
    // JSpecify annotations appear on generated public signatures, so consumers need them on their compile classpath
    api libs.jspecify
    implementation libs.swagger.annotations

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

def cleanOpenApiGenerateTask = tasks.register('cleanOpenApiGenerate', Delete) {
    delete fileTree("$projectDir/src/main/java/com/timr/api/apis")
    delete fileTree("$projectDir/src/main/java/com/timr/api/models")
}

openApiGenerate {
    generatorName = 'java'
    outputDir = "$projectDir"
    templateDir = "$projectDir/templates"
    configOptions = [
            library               : 'restclient',
            serializationLibrary  : 'jackson',
            useSpringBoot4        : 'true',
            useJackson3           : 'true',
            dateLibrary           : 'java8',
            openApiNullable       : 'true',
            useJspecify           : 'true',
            containerDefaultToNull: 'true',
            legacyDiscriminatorBehavior: 'true',
            interfaceOnly         : 'true',
            skipDefaultInterface  : 'true',
            apiPackage            : 'com.timr.api.apis',
            modelPackage          : 'com.timr.api.models',
            hideGenerationTimestamp: 'true'
    ]
}

tasks.named('openApiGenerate').configure { task ->
    task.dependsOn(cleanOpenApiGenerateTask)
}

// Generated sources are committed into this module's source set, so everything that reads them runs
// after generation; `build` on its own would otherwise quietly compile the previous generation's output.
tasks.matching {
    it.name in ['compileJava', 'compileTestJava', 'processResources', 'processTestResources', 'sourcesJar', 'javadoc']
}.configureEach {
    dependsOn tasks.named('openApiGenerate')
}

// The client reads its own version from here rather than carrying it in a hand-maintained string.
jar {
    manifest {
        attributes(
                'Implementation-Title': 'timr-api-restclient',
                'Implementation-Version': project.version
        )
    }
}

def snapshot = rootProject.ext.snapshotBuild
def artifactVersion = snapshot ? "${project.version}-SNAPSHOT" : project.version

publishing {
    publications {
        mavenJava(MavenPublication) {
            groupId = project.group
            artifactId = 'timr-api-restclient'
            version = artifactVersion
            from components.java

            pom {
                name = 'timr-api-restclient'
                description = 'Official Java client for the timr API, built on Spring RestClient.'
                url = 'https://developer.timr.com'
                licenses {
                    license {
                        name = 'The Apache License, Version 2.0'
                        url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                    }
                }
                organization {
                    name = 'troii Software GmbH'
                    url = 'https://troii.com'
                }
                scm {
                    url = 'https://github.com/troii/timr-api'
                    connection = 'scm:git:https://github.com/troii/timr-api.git'
                }
            }
        }
    }

    repositories {
        maven {
            name = 'timr'
            // A placeholder keeps the publish tasks present; the check below refuses to run them
            // when the environment has not said where to publish.
            url = rootProject.ext.publishUrl
                ?: layout.buildDirectory.dir('unconfigured-repository').get().asFile.toURI()
        }
    }
}

tasks.withType(PublishToMavenRepository).configureEach {
    doFirst {
        if (!rootProject.ext.publishUrl) {
            throw new GradleException('MAVEN_REPOSITORY_URL must be set to publish.')
        }
    }
    doLast {
        def artifactName = "${publication.groupId}:${publication.artifactId}:${publication.version}"
        println "Published '${artifactName}' to ${repository.url}"
    }
}
