plugins {
    id 'java-library'
    alias(libs.plugins.kotlin.jvm)
    alias(libs.plugins.openapi)
    alias(libs.plugins.google.artifact.registry)
    id 'maven-publish'
}
repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
    withJavadocJar()
}

kotlin {
    jvmToolchain(25)
}

dependencies {
    implementation libs.kotlin.stdlib
    implementation libs.kotlin.reflect
    implementation libs.kotlinx.coroutines.core
    implementation libs.gson
    implementation libs.okhttp

    testImplementation libs.junit.jupiter.api
    testImplementation libs.okhttp.mockwebserver
    testRuntimeOnly libs.junit.jupiter.engine
    testRuntimeOnly libs.junit.platform.launcher
}

test {
    useJUnitPlatform()
}

def cleanOpenApiGenerateTask = tasks.register('cleanOpenApiGenerate', Delete) {
    delete fileTree("$projectDir/src/main/kotlin")
}

openApiGenerate {
    generatorName = 'kotlin'
    outputDir = "$projectDir"
    configOptions = [
            library             : 'jvm-okhttp4',
            omitGradleWrapper   : 'true',
            packageName         : 'com.timr.api',
            enumPropertyNaming  : 'UPPERCASE',
            useCoroutines       : 'true',
            serializationLibrary: 'gson'
    ]
}

tasks.named('openApiGenerate').configure { task ->
    task.dependsOn(cleanOpenApiGenerateTask)
}

// Generated sources are committed into this module's source set, so everything that reads them runs
// after generation; `build` on its own would otherwise quietly compile the previous generation's output.
tasks.matching {
    it.name in ['compileKotlin', 'compileTestKotlin', 'processResources', 'processTestResources', 'sourcesJar', 'javadoc']
}.configureEach {
    dependsOn tasks.named('openApiGenerate')
}

def snapshot = rootProject.ext.snapshotBuild
def artifactVersion = snapshot ? "${project.version}-SNAPSHOT" : project.version

publishing {
    publications {
        mavenJava(MavenPublication) {
            groupId = project.group
            artifactId = 'timr-api-kotlin'
            version = artifactVersion
            from components.java

            pom {
                name = 'timr-api-kotlin'
                description = 'Official Kotlin client for the timr API, built on OkHttp with coroutines.'
                url = 'https://developer.timr.com'
                licenses {
                    license {
                        name = 'The Apache License, Version 2.0'
                        url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                    }
                }
                organization {
                    name = 'troii Software GmbH'
                    url = 'https://troii.com'
                }
                scm {
                    url = 'https://github.com/troii/timr-api'
                    connection = 'scm:git:https://github.com/troii/timr-api.git'
                }
            }
        }
    }

    repositories {
        maven {
            name = 'timr'
            // A placeholder keeps the publish tasks present; the check below refuses to run them
            // when the environment has not said where to publish.
            url = rootProject.ext.publishUrl
                ?: layout.buildDirectory.dir('unconfigured-repository').get().asFile.toURI()
        }
    }
}

tasks.withType(PublishToMavenRepository).configureEach {
    doFirst {
        if (!rootProject.ext.publishUrl) {
            throw new GradleException('MAVEN_REPOSITORY_URL must be set to publish.')
        }
    }
    doLast {
        def artifactName = "${publication.groupId}:${publication.artifactId}:${publication.version}"
        println "Published '${artifactName}' to ${repository.url}"
    }
}
